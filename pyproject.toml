[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-osint"
version = "1.3.0"
description = "Supervised OSINT procedures and a local, deterministic evidence-pack toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "agentic-OSINT contributors"}]
dependencies = ["jsonschema==4.25.1"]

[project.optional-dependencies]
reports = ["reportlab==4.4.4", "python-docx==1.2.0", "openpyxl==3.1.5"]
dev = ["build==1.3.0"]

[project.scripts]
osint-evidence = "agentic_osint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/agentic-osint/schemas" = ["schemas/*.json"]
