name: Immutable tagged release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -c requirements.lock '.[reports,dev]'
      - run: python build/build.py --check
      - run: python tools/check_release.py
      - run: python -m unittest discover -s tests -v

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -c requirements.lock '.[reports,dev]'
      - name: Match immutable tag to project version
        run: |
          python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['RELEASE_TAG']=='v'+v, 'tag/version mismatch'"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists; refusing to overwrite its assets.'
            exit 1
          fi
      - name: Revalidate and package canonical assets
        run: |
          python build/build.py --check
          python -m build
          python tools/check_release.py --archive "dist/agentic-osint-${RELEASE_TAG}.zip" --hash-assets dist
          python -c "from pathlib import Path; Path('release-notes.md').write_text(chr(10).join(['See CHANGELOG.md in the source archive for version details.', '', 'SHA256SUMS covers every attached distribution asset. Verify signed build provenance with gh attestation verify ASSET --repo ZvonkoNS/agentic-OSINT.', '', 'Portable prompts remain supervised procedures; see the documented validation limits.', '']), encoding='utf-8')"
      - name: Sign build provenance with GitHub OIDC and Sigstore
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'dist/*'
      - name: Publish once without replacing existing assets
        run: gh release create "$RELEASE_TAG" --verify-tag --title "agentic-OSINT $RELEASE_TAG" --notes-file release-notes.md dist/*
