name: Offline validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned runtime and report dependencies
        run: python -m pip install -c requirements.lock '.[reports,dev]'
      - name: Python syntax
        run: python -m compileall -q src build tools tests
      - name: Generated artifacts are current and byte-correct
        run: python build/build.py --check
      - name: Method and fixture integrity
        run: python tools/check_release.py
      - name: Offline regression and adversarial fixtures
        run: python -m unittest discover -s tests -v
      - name: Build distribution
        run: python -m build
      - name: Portable wiki generation
        run: python build/make_wiki.py --output wiki-check.md
